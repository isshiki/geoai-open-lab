[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "geoai-station-territory"
version = "0.1.0"
description = "Open and reproducible urban GeoAI and Location Intelligence experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "duckdb==1.5.5",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
    "scipy==1.17.1",
    "matplotlib>=3.10,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/station_territory"]

[dependency-groups]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]
